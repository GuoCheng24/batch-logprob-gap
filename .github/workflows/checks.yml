name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the tables in README.md must be the ones build_tables.py produces from results/
      - run: python scripts/build_tables.py > /tmp/TABLES.md && diff -u TABLES.md /tmp/TABLES.md
      - run: python scripts/refresh_readme.py && git diff --exit-code README.md
      - run: python scripts/check_table_anchors.py
      # the figures the README states in prose, not in a table
      - run: python scripts/check_prose_numbers.py
      # The hardware arm's control: tonight's RTX 4090 must reproduce the recorded
      # numbers, or the L40 comparison is between two environments, not two cards.
      - run: python scripts/hw_compare.py
      # the report may only quote numbers that occur in a committed result file
      - run: python paper/build.py && git diff --exit-code paper/report.md
      # and the committed PDF must be the one built from that report, not a version behind it
      - run: sudo apt-get install -y -qq poppler-utils
      - run: python paper/check_pdf_current.py
      # verl/: every number its README states must trace to verl/results, by the repository's own tool
      - run: pip install -q doubleblind-audit==0.1.1
      - run: cd verl && doubleblind trace README.md --data results/gates.json results/support_size_replay.json --no-color
